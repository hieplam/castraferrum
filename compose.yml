# Postgres for Castraferrum (Node runs directly on the host, only the DB lives in Docker).
#   docker compose -f compose.yml up -d        (in this folder)
# DB `loops` (real use) + `loops_test` (API / contract / e2e tests) are created the first time the volume is initialised.
# Change the port with LOOPS_PG_PORT in .env (same folder); npm start and the tests read the same variable.
# The three Docker names below can be overridden (see .env.example). The defaults must stay as they are:
# the default volume holds the real loop history.
name: ${LOOPS_COMPOSE_PROJECT:-loop-console}

services:
  postgres:
    image: postgres:18.6
    container_name: ${LOOPS_PG_CONTAINER:-loop_console_pg}
    environment:
      POSTGRES_USER: loops
      POSTGRES_PASSWORD: loops
      POSTGRES_DB: loops
    ports:
      - "127.0.0.1:${LOOPS_PG_PORT:-55432}:5432"
    volumes:
      # Postgres 18 and later mount the volume at /var/lib/postgresql (not /var/lib/postgresql/data).
      - loop_console_pg:/var/lib/postgresql
      - ./pg-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loops -d loops"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  loop_console_pg:
    name: ${LOOPS_PG_VOLUME:-loop_console_pg}
