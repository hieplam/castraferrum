name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lang-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: History and coupling
        run: node scripts/lang-scan.mjs --history --coupling
      - name: Pull request title, body and branch
        if: github.event_name == 'pull_request'
        run: node scripts/lang-scan.mjs --pr-event "$GITHUB_EVENT_PATH"

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: loops
          POSTGRES_PASSWORD: loops
          POSTGRES_DB: loops
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U loops -d loops"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      PGPASSWORD: loops
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Create the test database
        run: psql -h 127.0.0.1 -p 55432 -U loops -d loops -f pg-init/01-loops-test.sql
      - run: npm run typecheck
      - run: npm run arch
      - run: npm run test:unit
      - run: npm run build
      - run: npm run test:contract
