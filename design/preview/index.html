<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Castraferrum — Preview</title>
<script>document.documentElement.dataset.theme = new URLSearchParams(location.search).get('theme') || 'light';</script>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<style>
/* CSS of the index page only (not an app component) — it only reads the variables of tokens.css */
body { padding: 0 0 64px; }
.doc { max-width: 1560px; margin: 0 auto; padding: 0 32px; }
.doc-head { padding: 32px 0 20px; border-bottom: 1px solid var(--border); }
.doc-head h1 { margin: 4px 0 6px; font: 600 28px/36px var(--font-sans); }
.doc-head .row-links { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px; font: var(--text-xs)/var(--lh-xs) var(--font-mono); }
.doc-head a, .card a { color: var(--accent); text-decoration: none; }
.doc-head a:hover, .card a:hover { text-decoration: underline; }
.doc-head a.is-on { color: var(--text); font-weight: 600; }
.toc { display: flex; gap: 20px; flex-wrap: wrap; padding: 14px 0; border-bottom: 1px solid var(--border); font: var(--text-xs)/1 var(--font-mono); position: sticky; top: 0; background: var(--bg); z-index: 2; }
.toc a { color: var(--text-muted); text-decoration: none; }
.toc a b { color: var(--text); }
section { padding: 28px 0 8px; border-bottom: 1px solid var(--border); }
section > h2 { margin: 0 0 16px; font: 600 12px/16px var(--font-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--accent); }
section > h2 span { color: var(--text-faint); margin-left: 8px; text-transform: none; letter-spacing: 0; font-weight: 400; }
.cards { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
.card { background: var(--surface); border: 1px solid var(--border); display: flex; flex-direction: column; }
.card-head { padding: 10px 14px; display: flex; gap: 10px; align-items: baseline; border-bottom: 1px solid var(--border); }
.card-head .n { font: var(--text-xs)/1 var(--font-mono); color: var(--text-faint); }
.card-head .t { flex: 1; min-width: 0; }
.card-head code { font: var(--text-2xs)/1 var(--font-mono); color: var(--text-muted); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border); }
.pair a { display: block; position: relative; background: var(--bg); }
.pair img { display: block; width: 100%; height: 440px; object-fit: cover; object-position: top left; }
.pair .tag { position: absolute; left: 8px; bottom: 8px; font: var(--text-2xs)/1 var(--font-mono); padding: 3px 6px; background: var(--text); color: var(--bg); border-radius: 2px; }
.pair .missing { height: 440px; display: flex; align-items: center; justify-content: center; color: var(--err); font: var(--text-xs)/1 var(--font-mono); }
.chip { font: var(--text-2xs)/1 var(--font-mono); padding: 3px 6px; border-radius: var(--radius-control); white-space: nowrap; background: var(--accent-soft); color: var(--accent); }
.card-foot { padding: 8px 14px; display: flex; gap: 14px; font: var(--text-xs)/var(--lh-xs) var(--font-mono); color: var(--text-faint); }
</style>
</head>
<body>
<div class="doc">
  <header class="doc-head">
    <span class="brand">Castraferrum</span>
    <h1>Design preview — every screen × every state</h1>
    <div class="muted" id="lead"></div>
    <div class="row-links">
      <a href="../STATES.md">STATES.md — the state list + where each state comes from</a>
      <a href="../system/index.html">design system</a>
      <a href="../system/layout.html">sample layout</a>
      <a id="flip" href="#"></a>
      <span id="filters" class="row-links" style="margin:0"></span>
    </div>
  </header>
  <nav class="toc" id="toc"></nav>
  <div id="screens"></div>
</div>
<script src="states.js"></script>
<script>
const theme = document.documentElement.dataset.theme;
const ONLY = new URLSearchParams(location.search).get('only');
const ALL = window.PV_STATES, SCR = window.PV_SCREENS, TAGS = window.PV_TAGS;
const S = ONLY ? ALL.filter((s) => (s.tags || []).includes(ONLY)) : ALL;
const tagName = Object.fromEntries(TAGS);
document.getElementById('lead').innerHTML =
  `<b>${ALL.length}</b> states, each with two images <b>light | dark</b> shot from the live page (<span class="mono">app.html?state=…</span>). ` +
  `Click an image to see it at full size; “open page” shows the live version (switch EN/VI and light/dark right in the top bar). Shots are taken with <span class="mono">npm run design:shots</span>, ` +
  `the full set is checked with <span class="mono">npm run design:states</span>. Sample data: Sunday 18/10/2026 14:00:42, the server crashed on 17/10 at 09:31:05.`;
const flip = document.getElementById('flip');
flip.textContent = theme === 'dark' ? 'light index' : 'dark index';
flip.href = '?theme=' + (theme === 'dark' ? 'light' : 'dark') + (ONLY ? '&only=' + ONLY : '');
document.getElementById('filters').innerHTML = [`<a href="?theme=${theme}" class="${ONLY ? '' : 'is-on'}">all states</a>`]
  .concat(TAGS.map(([k, name]) => `<a href="?theme=${theme}&only=${k}" class="${ONLY === k ? 'is-on' : ''}">only ${name} (${ALL.filter((s) => (s.tags || []).includes(k)).length})</a>`)).join('');
document.getElementById('toc').innerHTML = SCR.map(([k, name]) => `<a href="#s-${k}"><b>${name}</b> ${S.filter((s) => s.screen === k).length}</a>`).join('');
const shot = (s, th) => `<a href="shots/${s.id}-${th}.png" title="${s.id} · ${th}"><img loading="lazy" src="shots/${s.id}-${th}.png" alt="${s.id} ${th}" onerror="this.outerHTML='<div class=missing>no ${th} image yet</div>'"><span class="tag">${th}</span></a>`;
let i = 0;
document.getElementById('screens').innerHTML = SCR.map(([k, name, path]) => {
  const list = S.filter((s) => s.screen === k);
  return `<section id="s-${k}"><h2>${name}<span>${path} · ${list.length} states</span></h2><div class="cards">` + list.map((s) => {
    i++;
    const q = `state=${s.id}`;
    return `<div class="card"><div class="card-head"><span class="n">${String(i).padStart(2, '0')}</span><span class="t">${s.title}</span>${(s.tags || []).map((g) => `<span class="chip">${tagName[g]}</span>`).join('')}<code>${s.id}</code></div>` +
      `<div class="pair">${shot(s, 'light')}${shot(s, 'dark')}</div>` +
      `<div class="card-foot"><a href="app.html?${q}&theme=light">open light page</a><a href="app.html?${q}&theme=dark">open dark page</a>${s.vp ? `<span>viewport ${s.vp[0]}px</span>` : ''}${s.lang ? `<span>UI ${s.lang.toUpperCase()}</span>` : ''}</div></div>`;
  }).join('') + '</div></section>';
}).join('');
</script>
</body>
</html>
