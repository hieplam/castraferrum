<!doctype html>

<head>
<meta charset="utf-8">

<title>Castraferrum design system</title>
<!-- The design-system page (UI uplift, epic #63, task U3): every family of spec 4.5 in every state of spec 4.4, light and
     dark side by side. "Phone width" draws the page in two 390px frames (index.html?frame=1&theme=...), one per theme.
     The components use only components.css; the <style> below lays out this page and nothing else. -->
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="components.css">
<style>
  .ds-top {
    display: flex; align-items: center; gap: var(--space-4); padding: var(--space-4) var(--space-8);
    background: var(--surface); border-bottom: var(--border-w) solid var(--border);
  }
  .ds-top h1 { flex: 1; margin: 0; font-size: var(--fs-h2); line-height: var(--lh-h2); }
  .ds-cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ds-col { min-width: 0; padding: var(--space-6) var(--space-6) var(--space-12); background: var(--bg); color: var(--text); }
  .ds-theme { margin: 0 0 var(--space-4); font-size: var(--fs-title); line-height: var(--lh-title); }
  .ds-sec { display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-6) 0; border-top: var(--border-w) solid var(--border); }
  .ds-sec > h2 { margin: 0; font-size: var(--fs-h2); line-height: var(--lh-h2); }
  .ds-cap { margin: 0; color: var(--text-subtle); font-family: var(--font-data); font-size: var(--fs-cap); line-height: var(--lh-cap); }
  .ds-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
  .ds-stack { display: flex; flex-direction: column; gap: var(--space-3); }
  .ds-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-3); }
  .ds-stage {
    position: relative; overflow: hidden; transform: translateZ(0); min-height: var(--size-log);
    border: var(--border-w) dashed var(--border-strong); border-radius: var(--radius-card); background: var(--bg);
  }
  .ds-stage.is-tall { min-height: var(--size-tx); }
  .ds-tipbox { position: relative; display: flex; align-items: flex-end; gap: var(--space-12); min-height: var(--space-12); padding: var(--space-10) var(--space-12) var(--space-10); }
  .ds-tipbox > span { position: relative; display: inline-flex; }
  .ds-pad { padding: var(--space-4); }
  .ds-phone { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--space-6); padding: var(--space-6); }
  .ds-phone iframe { width: 390px; height: 844px; border: var(--border-w) solid var(--border-strong); border-radius: var(--radius-sheet); background: var(--bg); }
  .ds-frame .ds-top { display: none; }
  .ds-frame .ds-cols { grid-template-columns: minmax(0, 1fr); }
  @media (max-width: 1023.98px) {
    .ds-cols { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 639.98px) {
    .ds-col { padding: var(--space-4) var(--space-3) var(--space-12); }
    .ds-grid { grid-template-columns: minmax(0, 1fr); }
  }
</style>
</head>

<script>
  // Fills each theme column from the template; ?frame=1&theme=<t> draws one theme only (the phone frames).
  const params = new URLSearchParams(location.search);
  const frame = params.get('frame') === '1';
  const content = document.getElementById('ds-content');
  if (frame) {
    const theme = params.get('theme') === 'dark' ? 'dark' : 'light';
    document.documentElement.classList.add('ds-frame');
    document.documentElement.setAttribute('data-theme', theme);
    for (const col of document.querySelectorAll('.ds-col')) if (col.dataset.theme !== theme) col.remove();
  }
  for (const col of document.querySelectorAll('.ds-col')) col.appendChild(content.content.cloneNode(true));
  const desk = document.getElementById('ds-desk');
  const phone = document.getElementById('ds-phone');
  const toggle = document.getElementById('ds-phone-switch');
  toggle.addEventListener('click', () => {
    const on = toggle.getAttribute('aria-pressed') !== 'true';
    toggle.setAttribute('aria-pressed', String(on));
    if (on && !phone.childElementCount) {
      for (const theme of ['light', 'dark']) {
        const f = document.createElement('iframe');
        f.src = `index.html?frame=1&theme=${theme}`;
        f.title = `Phone width, ${theme}`;
        phone.appendChild(f);
      }
    }
    phone.hidden = !on;
    desk.hidden = on;
  });
</script>
