# nginx for the local name https://castra.home.arpa (local-name spec D3 and D4).
# A complete main file: check it with `nginx -t -c <this file>`.
#
# CERT_DIR is a placeholder. In the copy that nginx runs, replace it with the folder that holds the mkcert files,
# the castraferrum/tls folder under your local app data folder (forward slashes, no spaces). See README.md here.

events {}

http {
  # Port 80: send every request to the HTTPS address.
  server {
    listen 80;
    server_name castra.home.arpa;
    return 301 https://castra.home.arpa$request_uri;
  }

  # Port 443: HTTPS with the mkcert certificate, then on to Castraferrum on this PC.
  server {
    listen 443 ssl;
    server_name castra.home.arpa;

    ssl_certificate     CERT_DIR/castra.home.arpa.pem;
    ssl_certificate_key CERT_DIR/castra.home.arpa-key.pem;

    location / {
      proxy_pass http://127.0.0.1:7070;
      proxy_http_version 1.1;

      # Keep the upstream connection open (needed for Server-Sent Events).
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      # Set, not appended: a device cannot add a false value.
      proxy_set_header X-Real-IP $remote_addr;

      # SSE lines must reach the browser at once. The server sends :ping every 15 s, far below 1h.
      proxy_buffering off;
      proxy_read_timeout 1h;
    }
  }
}
