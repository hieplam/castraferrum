# nginx for the local name (local-name spec D3, D4 and D13). The sample name is castra.example.com.
# A complete main file: check it with `nginx -t -c <this file>`.
#
# Two placeholders, both replaced in the copy that nginx runs (never in this file), see README.md here:
#   LOCAL_NAME  the console name of this machine (the value of the LOCAL_NAME variable)
#   CERT_DIR    the folder that win-acme writes the PEM files to: C:/ProgramData/castraferrum/tls (forward slashes)

events {}

http {
  # Port 80: send every request to the HTTPS address.
  server {
    listen 80;
    server_name LOCAL_NAME;
    return 301 https://LOCAL_NAME$request_uri;
  }

  # Port 443: HTTPS with the Let's Encrypt certificate, then on to Castraferrum on this PC.
  server {
    listen 443 ssl;
    server_name LOCAL_NAME;

    # The certificate and its intermediate certificates, as win-acme writes them.
    ssl_certificate     CERT_DIR/LOCAL_NAME-chain.pem;
    ssl_certificate_key CERT_DIR/LOCAL_NAME-key.pem;

    location / {
      proxy_pass http://127.0.0.1:7070;
      proxy_http_version 1.1;

      # Keep the upstream connection open (needed for Server-Sent Events).
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      # Set, not appended: a device cannot add a false value.
      proxy_set_header X-Real-IP $remote_addr;
      # Never trust a CF-Connecting-IP from a device: only a Cloudflare tunnel sets it (ADR 0006, D18). Blanked here so that
      # a device on the home path cannot pick the sign-in attempt count of another client.
      proxy_set_header CF-Connecting-IP "";

      # SSE lines must reach the browser at once. The server sends :ping every 15 s, far below 1h.
      proxy_buffering off;
      proxy_read_timeout 1h;
    }
  }
}
